<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Page Not Found | Language Lineage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Geist', system-ui, sans-serif;
        background: #000;
        color: #f5f5f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        color: #4ade80;
        font: 700 72px/1 'JetBrains Mono', ui-monospace, monospace;
      }
      p { margin: 0; color: #a3a3a3; font-size: 18px; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
      a { color: #4ade80; font-size: 15px; text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
      span { color: #737373; }
    </style>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Page not found</p>
      <nav aria-label="Helpful links">
        <a href="/">Home</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/explore">Graph Explorer</a>
        <span aria-hidden="true">&middot;</span>
        <a href="/dataset">Dataset</a>
      </nav>
    </main>
  </body>
</html>
