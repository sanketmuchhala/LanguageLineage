<text x="60" y="110" class="pt1">What programming languages are written in</text>
<text x="60" y="160" class="ps">Each card: an implementation language, and the languages and tools whose current compiler or runtime is written in it.</text>
<text x="60" y="196" class="pk">White: languages. Grey: tools (compilers, runtimes, engines). Current relationships only; a language can appear in several cards.</text>
