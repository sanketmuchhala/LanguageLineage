<title id="poster-title">What programming languages are written in</title>
<desc id="poster-desc">Languages and tools grouped by the language their current compiler or runtime is written in, from the Language Lineage dataset v5.0. 202 current implementation relationships. https://www.languagelineage.org/posters/programming-language-implementation-family-tree</desc>
